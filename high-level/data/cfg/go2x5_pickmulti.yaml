env:
  numEnvs: 256
  numAgents: 1
  envSpacing: 5.0
  enableDebugVis: False
  isFlagrun: False
  maxEpisodeLength: 150
  globalStepCounter: 50000
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 4
  controlFrequencyLow: 8
  imgDelayFrame: 4

  liftedSuccessThreshold: 0.15
  liftedInitThreshold: 0.03
  successEeDistThreshold: 0.12
  baseObjectDisThreshold: 0.45
  commandStopDistance: 0.45
  holdSteps: 25
  lastCommands: False
  printResetStats: False

  numGripperDof: 1
  numPhysicalGripperDof: 2
  gripperOpenAtUpper: True
