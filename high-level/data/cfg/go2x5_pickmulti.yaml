physics_engine: "physx"

sim:
  substeps: 1
  use_gpu_pipeline: True
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  dt: 0.005

  physx:
    use_gpu: True
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.01
    rest_offset: 0.0
    bounce_threshold_velocity: 0.5
    max_depenetration_velocity: 1.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 16777216

reward:
  base_height_target: 0.32
  only_positive_rewards: False
  scales:
    approaching: 0.5
    lifting: 1.0
    pick_up: 3.5
    acc_penalty: -0.001
    command_penalty: -1.0
    command_reward: 0.25
    standpick: 0.25
    action_rate: -0.001
    # Align the gripper approach x-axis with the object instead of leaving the
    # high-level orientation actions unsupervised.
    ee_orn: 0.25
    base_dir: 0.25
    rad_penalty: 0.0
    base_ang_pen: 0.0
    base_approaching: 0.01
    grasp_base_height: 0.5
    gripper_rate: 0.0

