  # entrypoints must receive an explicit schema-v2 12D checkpoint path.
  low_policy_path: ""
  requireLowPolicyMetadata: True
  lowPolicyNumActions: 12
  lowPolicyObserveGaitCommands: False
  lowPolicyReorderDofs: True
  lowPolicyOutputTanh: True
  lowPolicyActionClip: 1.0
  lowActionScale: [0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 0.125, 0.25, 0.25]
  lowLevelLinVelClip: 0.05
  lowLevelAngVelYawClip: 0.05
  lowLevelAngVelPitchClip: 0.25
  lowFootContactThreshold: 1.5
  lowEeGoalRanges: [[0.215, 0.565], [-0.225, 0.225], [-0.364, 0.036]]
  lowEeGoalMaxNominalReachRadius: 0.64
  lowEeGoalOrnRanges: [[-0.35, 0.35], [1.0, 1.5], [-1.0, 1.0]]
  robotStartPose: [-0.45, 0.0, 0.32]
  evalRobotStartPose: [-0.45, 0.0, 0.32]
  resetEEGoalToCurrent: True
  initialEEGoalCart: [0.365, 0.0, -0.164]
  initialEEGoalOrnRPY: [0.0, 1.25, 0.0]
  maskArmGoalCart: [0.365, 0.0, -0.064]
  armBaseOffset: [0.085, 0.0, 0.094]
  eeGoalCenterOffset: [0.085, 0.0, 0.414]
  eeFrame: "TERRAIN_INVARIANT_YAW"
  armIkGain: 0.20
  armIkOrientationWeight: 0.35
  trackEeOrientation: True
  lowPolicyOrientationObservation: True
  armTargetMode: "persistent_joint_command"
  armTargetMaxStep: 0.08
  armTargetUpdatePeriod: 4
  baseHeightClip: [0.2, 0.42]
  eeBodyName: "arm_eef_link"
  wristBodyName: "arm_link6"
  flangeBodyName: "arm_link6"
